<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seed</title>
  <script src="mraid.js" vite-ignore></script>
  <script>
    /* MRAID v2.0 Compliant Click-Through Engine - injected by MRAID Fixer */
    (function () {
      function getClickTarget(u) {
        return u || window.clickTag || "";
      }
      window.openMraidDestination = function (targetUrl) {
        var clickTarget = getClickTarget(targetUrl);
        if (typeof clickTarget !== "string") return;
        if (typeof mraid === "undefined" || typeof mraid.open !== "function") return false;
        try {
          if (typeof mraid.getState === "function" && mraid.getState() === "loading") return false;
          if (typeof window.isMraidUsable === "function" && !window.isMraidUsable(mraid)) return false;
          if (clickTarget) { mraid.open(clickTarget); } else { mraid.open(); }
          return true;
        } catch (err) { console.error("[MRAID] open threw", err); return false; }
      };
      window.handleMraidOpen = function (targetUrl) { return window.openMraidDestination(targetUrl); };
      window.handleClickAction = function () { return window.openMraidDestination(); };
    })();
  </script>
  <script>
    (function () {
      let mraidIsReady = false;
      let mraidReadyListenerAttached = false;

      function trackMraidReadiness(mraid) {
        if (
          mraidReadyListenerAttached ||
          !mraid ||
          typeof mraid.addEventListener !== "function"
        ) {
          return;
        }

        try {
          mraid.addEventListener("ready", function () {
            mraidIsReady = true;
          });
          mraidReadyListenerAttached = true;
        } catch (error) { }
      }

      window.isMraidUsable = function (mraid) {
        if (!mraid) return false;
        trackMraidReadiness(mraid);
        if (typeof mraid.getState !== "function") return true;

        try {
          const state = mraid.getState();
          return state === "default" || state === "expanded";
        } catch (error) {
          return mraidIsReady;
        }
      };

      // Routed through the guarded click engine above (window.openMraidDestination),
      // which resolves the clickTag fallback chain and opens the destination safely.
      window.handleMraidClick = function (providedUrl) {
        if (window.openMraidDestination(providedUrl)) return;

        console.log("CTA_CLICKED");
      };

      let mraidViewable = true;

      function syncMediaState() {
        const media = document.querySelectorAll("video, audio");
        media.forEach(function (element) {
          if (!mraidViewable) {
            element.pause();
          } else if (element.tagName === "VIDEO" && element.autoplay) {
            element.play().catch(function () { });
          }
        });
      }

      window.isMraidViewable = function () {
        return mraidViewable;
      };

      window.setupMraidViewability = function () {
        if (typeof mraid === "undefined") return;

        function handleViewableChange(viewable) {
          mraidViewable = Boolean(viewable);
          syncMediaState();
        }

        if (typeof mraid.isViewable === "function") {
          try {
            mraidViewable = Boolean(mraid.isViewable());
          } catch (error) {
            mraidViewable = true;
          }
        }

        if (typeof mraid.addEventListener === "function") {
          mraid.addEventListener("viewableChange", handleViewableChange);
        }

        syncMediaState();
      };

      if (window.mraid) trackMraidReadiness(window.mraid);
    })();
  </script>
  <script>
    (function () {
      let creativeInitialized = false;

      function init() {
        if (creativeInitialized) return;
        creativeInitialized = true;
        window.__appLovinMraidReady = true;
        window.dispatchEvent(new Event("applovinMraidReady"));
      }

      if (typeof mraid === "undefined") {
        init();
      } else {
        if (mraid.getState() === "loading") {
          mraid.addEventListener("ready", init);
        } else {
          init();
        }
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
